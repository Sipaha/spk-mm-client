name: spk-mm-client
arch: ${ARCH}
platform: linux
version: ${RELEASE_VERSION}
version_schema: semver
section: net
priority: optional
maintainer: Pavel Simonov <sipahabk@gmail.com>
vendor: SPK
homepage: https://github.com/Sipaha/spk-mm-client
license: Apache-2.0
description: |
  A native desktop client for Mattermost with multiple servers, messages,
  threads, search and attachments. Uses the system WebView.
contents:
  - src: build/bin/spk-mm-client-release
    dst: /usr/bin/spk-mm-client
    file_info:
      mode: 0755
  - src: packaging/linux/spk-mm-client.desktop
    dst: /usr/share/applications/spk-mm-client.desktop
    file_info:
      mode: 0644
  - src: internal/appfiles/icons/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/spk-mm-client.png
    file_info:
      mode: 0644
  - src: internal/appfiles/icons/icon.png
    dst: /usr/share/pixmaps/spk-mm-client.png
    file_info:
      mode: 0644
  - src: packaging/linux/ru.spk.spk-mm-client.metainfo.xml
    dst: /usr/share/metainfo/ru.spk.spk-mm-client.metainfo.xml
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/spk-mm-client/LICENSE
    file_info:
      mode: 0644
  - src: THIRD-PARTY-NOTICES.txt
    dst: /usr/share/doc/spk-mm-client/THIRD-PARTY-NOTICES.txt
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/doc/spk-mm-client/NOTICE
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/linux/update-caches.sh
  postremove: packaging/linux/update-caches.sh
rpm:
  compression: gzip
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgtk-3-0t64 | libgtk-3-0
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      - glibc >= 2.39
      - gtk3
      - webkit2gtk4.1
