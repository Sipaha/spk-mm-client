name: Native build environment
description: Pinned toolchain and workspace-local build scratch
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        scratch=Path(os.environ['GITHUB_WORKSPACE'])/'.tmp'
        env={'MM_RELEASE_SCRATCH':scratch,'TMPDIR':scratch/'tmp','TMP':scratch/'tmp','TEMP':scratch/'tmp','GOCACHE':scratch/'go-cache','GOMODCACHE':scratch/'go-mod','GOBIN':scratch/'tools','PLAYWRIGHT_BROWSERS_PATH':scratch/'browsers','PYTHONPYCACHEPREFIX':scratch/'pycache'}
        for value in env.values():value.mkdir(parents=True,exist_ok=True)
        with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
            for key,value in env.items():out.write(f'{key}={value}\n')
        with open(os.environ['GITHUB_PATH'],'a',encoding='utf-8') as out:out.write(str(scratch/'tools')+'\n')
        PY
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.33.0
        cache: false
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev desktop-file-utils xvfb x11-utils imagemagick tesseract-ocr
    - shell: bash
      run: |
        pnpm --dir frontend install --frozen-lockfile --store-dir .tmp/pnpm-store
        pnpm --dir tests/e2e install --frozen-lockfile --store-dir .tmp/pnpm-store
