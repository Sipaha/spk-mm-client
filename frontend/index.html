<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Dark by default, no setting (see docs/specs UI section): sets the
         background before Tailwind's CSS module has loaded, so there is no
         white flash at startup. Must track --color-app in index.css (theme
         refresh 2026-10-02: editor-inspired cool grey) — this one can't reference
         the CSS variable (it paints before that stylesheet exists). -->
    <style>
      :root { color-scheme: dark; }
      html, body { background: #282c34; }
    </style>
    <title>spk-mm-client</title>
  </head>
  <body class="bg-app text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
